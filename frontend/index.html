<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AttendEase – Login</title>
  <link rel="stylesheet" href="css/style.css"/>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 700px 500px at 15% 20%, rgba(61,142,248,.12) 0%, transparent 70%),
        radial-gradient(ellipse 500px 400px at 85% 80%, rgba(108,92,231,.10) 0%, transparent 70%);
    }
    .auth-box {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 24px; padding: 40px 36px;
      box-shadow: var(--shadow);
    }
    .auth-logo { margin-bottom: 28px; }
    .auth-tabs {
      display: flex; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 4px; margin-bottom: 24px; gap: 4px;
    }
    .auth-tab {
      flex: 1; padding: 9px; border: none; background: transparent;
      color: var(--muted); font-family: 'Syne', sans-serif;
      font-size: .85rem; font-weight: 700; border-radius: 9px;
      cursor: pointer; transition: background .2s, color .2s;
    }
    .auth-tab.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
    }
    .auth-note {
      text-align: center; font-size: 12px; color: var(--muted); margin-top: 14px;
    }
    .auth-note span { color: var(--accent); cursor: pointer; font-weight: 600; }
    .auth-note span:hover { text-decoration: underline; }

    /* ── PASSWORD FIELD WITH TOGGLE ── */
    .pass-wrap {
      position: relative;
    }
    .pass-wrap input {
      width: 100%; padding-right: 44px; box-sizing: border-box;
    }
    .pass-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 18px; padding: 0; line-height: 1;
      transition: color .2s;
    }
    .pass-toggle:hover { color: var(--accent); }

    /* ── PASSWORD STRENGTH ── */
    .strength-bar {
      display: flex; gap: 4px; margin-top: 6px;
    }
    .strength-seg {
      flex: 1; height: 3px; border-radius: 99px;
      background: var(--border); transition: background .3s;
    }
    .strength-label {
      font-size: 11px; color: var(--muted); margin-top: 4px; min-height: 14px;
    }

    /* ── CAPTCHA WRAPPER ── */
    .captcha-wrap {
      margin: 16px 0;
      display: flex; justify-content: center;
    }

    /* ── DIVIDER ── */
    .auth-divider {
      display: flex; align-items: center; gap: 10px;
      margin: 16px 0; color: var(--muted); font-size: 12px;
    }
    .auth-divider::before, .auth-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* ── FORGOT PASSWORD ── */
    .forgot-link {
      text-align: right; margin-top: -8px; margin-bottom: 14px;
    }
    .forgot-link span {
      font-size: 12px; color: var(--accent); cursor: pointer; font-weight: 600;
    }
    .forgot-link span:hover { text-decoration: underline; }

    /* recaptcha dark mode fix */
    [data-theme="dark"] .g-recaptcha iframe {
      filter: invert(0.9) hue-rotate(180deg);
    }
  </style>
</head>
<body>

  <button class="theme-btn" id="themeBtn">🌙</button>

  <div class="auth-box anim-fadeup">

    <div class="auth-logo logo-wrap">
      <div class="logo-icon">🎓</div>
      <span class="logo-text">AttendEase</span>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin"    onclick="switchTab('login')">Login</button>
      <button class="auth-tab"        id="tabRegister" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Alert -->
    <div id="authAlert" class="alert-box error"></div>

    <!-- ══ LOGIN FORM ══ -->
    <div id="loginForm">
      <div class="field-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="you@email.com" autocomplete="email"/>
      </div>
      <div class="field-group">
        <label>Password</label>
        <div class="pass-wrap">
          <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password"/>
          <button class="pass-toggle" type="button" onclick="togglePass('loginPass', this)" tabindex="-1">👁️</button>
        </div>
      </div>
      <div class="forgot-link">
        <span onclick="showForgot()">Forgot password?</span>
      </div>
      <button class="btn-primary full" id="loginBtn" onclick="doLogin()">Login →</button>
      <p class="auth-note">No account? <span onclick="switchTab('register')">Register here</span></p>
    </div>

    <!-- ══ REGISTER FORM ══ -->
    <div id="registerForm" style="display:none;">
      <div class="field-group">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="Your full name" autocomplete="name"/>
      </div>
      <div class="field-group">
        <label>Email Address</label>
        <input type="email" id="regEmail" placeholder="you@email.com" autocomplete="email"/>
      </div>
      <div class="field-group">
        <label>Password</label>
        <div class="pass-wrap">
          <input type="password" id="regPass" placeholder="Min 6 characters" autocomplete="new-password" oninput="checkStrength(this.value)"/>
          <button class="pass-toggle" type="button" onclick="togglePass('regPass', this)" tabindex="-1">👁️</button>
        </div>
        <div class="strength-bar">
          <div class="strength-seg" id="seg1"></div>
          <div class="strength-seg" id="seg2"></div>
          <div class="strength-seg" id="seg3"></div>
          <div class="strength-seg" id="seg4"></div>
        </div>
        <div class="strength-label" id="strengthLabel"></div>
      </div>
      <div class="field-group">
        <label>Confirm Password</label>
        <div class="pass-wrap">
          <input type="password" id="regPass2" placeholder="Repeat password" autocomplete="new-password"/>
          <button class="pass-toggle" type="button" onclick="togglePass('regPass2', this)" tabindex="-1">👁️</button>
        </div>
      </div>

      <!-- Google reCAPTCHA v2 -->
      <div class="captcha-wrap">
        <div class="g-recaptcha"
             data-sitekey="6LeVFqYsAAAAALZHTAV1YMFvERfiNSLKr2d5yBQ7"
             data-theme="dark">
        </div>
      </div>

      <button class="btn-primary full" id="registerBtn" onclick="doRegister()">Create Account →</button>
      <p class="auth-note">Have an account? <span onclick="switchTab('login')">Login</span></p>
    </div>

  </div>

  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // ── SHOW/HIDE PASSWORD ──
    function togglePass(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    // ── PASSWORD STRENGTH ──
    function checkStrength(val) {
      const segs  = [document.getElementById('seg1'), document.getElementById('seg2'),
                     document.getElementById('seg3'), document.getElementById('seg4')];
      const label = document.getElementById('strengthLabel');
      let score = 0;
      if (val.length >= 6)  score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
      if (/[0-9]/.test(val) && /[^A-Za-z0-9]/.test(val)) score++;

      const colors = ['#f25c69','#f4845f','#f9c74f','#00d4aa'];
      const labels = ['','Weak','Fair','Good','Strong'];
      segs.forEach((s, i) => {
        s.style.background = i < score ? colors[score - 1] : 'var(--border)';
      });
      label.textContent = val.length > 0 ? labels[score] : '';
      label.style.color  = score > 0 ? colors[score - 1] : 'var(--muted)';
    }

    // ── FORGOT PASSWORD ──
    function showForgot() {
      const email = (document.getElementById('loginEmail').value || '').trim();
      if (!email || !email.includes('@')) {
        showAlert('authAlert', '⚠️ Enter your email above first, then click Forgot password.');
        return;
      }
      showAlert('authAlert', '📧 Password reset is not yet implemented. Please contact support or re-register.', 'success');
    }
  </script>
</body>
</html>
